name: Campus Atlas v2 Visual QA
on:
  push:
    branches:
      - campus-atlas-dongxin-facade-v2-20261013
    paths:
      - campus-atlas/**
      - .github/workflows/campus-atlas-v2-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser runtime
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Syntax checks
        run: |
          node --check campus-atlas/src/app.js
          node --check campus-atlas/src/dongxinFacade.js
          node --check campus-atlas/src/schoolData.js
      - name: Start local demo
        run: |
          (cd campus-atlas && python -m http.server 8765 --bind 127.0.0.1 > /tmp/campus-server.log 2>&1) &
          sleep 2
          curl -fsS http://127.0.0.1:8765/ > /dev/null
      - name: Browser visual and movement checks
        run: python campus-atlas/tests/smoke_v2.py
      - name: Zip self-contained source
        if: always()
        run: zip -qr campus-atlas-v2-source.zip campus-atlas -x '*/__pycache__/*'
      - name: Preserve screenshots and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-atlas-v2-qa
          path: |
            qa-output/
            campus-atlas-v2-source.zip
          if-no-files-found: warn
          retention-days: 10
