name: Free zh-TW TTS Render

on:
  push:
    paths:
      - 'tts_scripts.json'
      - '.github/workflows/tts.yml'
  workflow_dispatch:

jobs:
  render-tts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Generate zh-TW narration with word boundaries
        shell: bash
        run: |
          mkdir -p tts_output
          python - <<'PY'
          import asyncio, json, pathlib
          import edge_tts

          data=json.load(open('tts_scripts.json',encoding='utf-8'))
          out=pathlib.Path('tts_output')
          voice='zh-TW-HsiaoChenNeural'
          rate='-5%'

          async def render(i, item):
              mp3=out/f'tts_{i:02}.mp3'
              words=out/f'tts_{i:02}_words.json'
              display_text=item.get('display_text', item.get('text',''))
              tts_text=item.get('tts_text', item.get('text',''))
              communicate=edge_tts.Communicate(tts_text, voice, rate=rate, boundary='WordBoundary')
              word_rows=[]
              with mp3.open('wb') as audio_file:
                  async for chunk in communicate.stream():
                      if chunk['type']=='audio':
                          audio_file.write(chunk['data'])
                      elif chunk['type']=='WordBoundary':
                          word_rows.append({
                              'offset_100ns': int(chunk['offset']),
                              'duration_100ns': int(chunk['duration']),
                              'start': float(chunk['offset'])/10_000_000.0,
                              'duration': float(chunk['duration'])/10_000_000.0,
                              'end': float(chunk['offset']+chunk['duration'])/10_000_000.0,
                              'text': chunk['text'],
                          })
              words.write_text(json.dumps({
                  'title': item['title'],
                  'voice': voice,
                  'rate': rate,
                  'display_text': display_text,
                  'tts_text': tts_text,
                  'words': word_rows,
              }, ensure_ascii=False, indent=2), encoding='utf-8')
              print('Generated', i, item['title'], 'word boundaries:', len(word_rows))

          async def main():
              for i,item in enumerate(data,1):
                  await render(i,item)

          asyncio.run(main())
          PY

      - name: Upload narration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-zh-tw-tts-word-boundary
          path: tts_output/
          retention-days: 7
