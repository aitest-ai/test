name: REA Badminton Duel Research
on:
  push:
    branches: [rea-badminton-baseball-study-20261014]
    paths:
      - research/badminton-duel/**
      - .github/workflows/rea-badminton-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examine:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chrome and REA
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm install --global rea-agents@6.4.0
          node --version
          rea --version || true
      - name: Inspect the public badminton website
        run: python research/badminton-duel/inspect_site.py
      - name: Verify evidence output
        if: always()
        run: |
          test -f study-output/summary.json || exit 1
          python -c "import json; d=json.load(open('study-output/summary.json')); print('HTTP=',d.get('http_status'),'REA=',d.get('rea_target_found'))"
      - name: Keep investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badminton-duel-rea-evidence
          path: study-output/
          if-no-files-found: warn
          retention-days: 7
