name: QA Campus Atlas (browser)
on:
  push:
    branches:
      - campus-atlas-v1-20261012
    paths:
      - campus-atlas/**
      - .github/workflows/campus-atlas-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright browser
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run site QA
        run: python campus-atlas/tests/smoke.py
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-atlas-qa
          path: qa-output/
          retention-days: 7
          if-no-files-found: warn
